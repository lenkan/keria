name: GitHub Actions for KERIA

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'weboftrust/keria' }}

on:
  push:
    branches:
      - "main"
      - "docker-publish-lenkan"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, ubuntu-22.04, ubuntu-24.04, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.8

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.5"
      - name: Install dependencies
        run: make install-dev

      - name: Lint changes
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run core KERIA tests
        run: make test

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.8
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.5"
      - name: Install dependencies
        run: make install-dev
      - name: Run core KERIA tests
        run: make test-coverage
      - name: Upload
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-24.04
    # needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Log in to docker registry
        uses: docker/login-action@v3
        if: ${{ env.DOCKER_REGISTRY != 'ghcr.io' }}
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ghcr
        uses: docker/login-action@v3
        if: ${{ env.DOCKER_REGISTRY == 'ghcr.io' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.DOCKER_REGISTRY}}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value={{date 'YYYYMMDD_HHMMSS'}}
            type=raw,value={{date 'YYYYMMDD_HHMMSS'}}

      - name: Run docker container
        run: docker compose up --build --wait

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
